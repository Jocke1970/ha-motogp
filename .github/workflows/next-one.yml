name: MotoGP Next single-resource regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  next-one:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned single file and check JavaScript
        run: |
          set -euo pipefail
          python3 scripts/build-next-one.py frontend /tmp/ha-motogp-next.js
          node --check /tmp/ha-motogp-next.js
          test "$(git hash-object dist/ha-motogp-next.js)" = b15fb60af3a8140c191261f9ec0eac224b530d7b
          test "$(git hash-object dist/ha-motogp-next.js)" = "$(git hash-object /tmp/ha-motogp-next.js)"
      - name: Session transitions, Q1, lap stats, live age, local timer and spoiler
        run: node tests/frontend-next-one.cjs /tmp/ha-motogp-next.js
      - name: Installer syntax, verified old-version upgrade, repeatability and tamper rejection
        run: |
          set -euo pipefail
          bash -n scripts/install-next-one.sh
          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          mkdir -p "$staging/www"
          export MOTOGP_WWW_DIR="$staging/www"
          export MOTOGP_BUNDLE_FILE="$PWD/dist/ha-motogp-next.js"
          target="$staging/www/ha-motogp-next.js"
          git show 0cfc4708ed0438b432d74f5ad560ef1eddacf1b2:dist/ha-motogp-next.js > "$target"
          test "$(git hash-object "$target")" = c40b9cf65bd150043aecf8c0efeaa10a291d269d
          bash scripts/install-next-one.sh
          node --check "$target"
          sha="$(git hash-object "$target")"
          test "$sha" = b15fb60af3a8140c191261f9ec0eac224b530d7b
          bash scripts/install-next-one.sh
          test "$sha" = "$(git hash-object "$target")"
          printf '\n/* modified */\n' >> "$target"
          if bash scripts/install-next-one.sh; then
            echo 'ERROR: installer overwrote an unknown destination' >&2
            exit 1
          fi
          test "$(git hash-object "$target")" != "$sha"
          rm -- "$target"
          printf 'tampered\n' > "$staging/tampered.js"
          export MOTOGP_BUNDLE_FILE="$staging/tampered.js"
          if bash scripts/install-next-one.sh; then
            echo 'ERROR: installer accepted modified source' >&2
            exit 1
          fi
          test ! -e "$target"
          export MOTOGP_BUNDLE_FILE="$PWD/dist/ha-motogp-next.js"
          bash scripts/install-next-one.sh
          test "$(git hash-object "$target")" = "$sha"
