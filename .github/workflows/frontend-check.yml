name: Frontend check

on:
  push:
    branches: [dev, beta]
  pull_request:
    branches: [beta, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax (mobile legacy, isolated next, and split cards)
        run: |
          node --check frontend/ha-motogp-card.js
          node --check frontend/ha-motogp-next-card.js
          node --check frontend/ha-motogp-next-split.js
      - name: Original frontend smoke tests
        env:
          TZ: Europe/Stockholm
        run: node tests/frontend-smoke.cjs
      - name: Original spoiler and midnight regression
        env:
          TZ: Europe/Stockholm
        run: node tests/frontend-spoiler.cjs
      - name: Original version and duplicate-resource regression
        env:
          TZ: Europe/Stockholm
        run: node tests/frontend-version.cjs
      - name: New isolated MotoGP frontend regression
        env:
          TZ: Europe/Stockholm
        run: node tests/frontend-next.cjs
      - name: Standalone timing and overview regression
        env:
          TZ: Europe/Stockholm
        run: node tests/frontend-next-split.cjs
