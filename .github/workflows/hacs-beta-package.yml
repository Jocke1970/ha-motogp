name: Package MotoGP HACS beta

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/hacs-beta-package.yml'
      - 'custom_components/motogp_sensor/**'
      - 'tests/test_weekend_regressions.py'
      - 'tests/test_session_lap_archive.py'
      - 'docs/hacs-beta-release-notes.md'

permissions:
  contents: write

concurrency:
  group: motogp-hacs-beta-package
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile complete integration
        run: python -m compileall -q custom_components/motogp_sensor

      - name: Run October weekend regressions
        run: python tests/test_weekend_regressions.py

      - name: Run session archive regressions
        run: python -m unittest discover -s tests -p 'test_session_lap_archive.py' -v

      - name: Verify HACS package metadata and required runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('custom_components/motogp_sensor')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          assert manifest['domain'] == 'motogp_sensor'
          assert manifest['version'] == '2026.10.0b3'
          assert manifest.get('codeowners') == ['@Jocke1970']

          required = {
              '__init__.py',
              'api.py',
              'const.py',
              'coordinator.py',
              'helpers.py',
              'schedule_time.py',
              'sensor.py',
              'session_lap_archive.py',
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          assert not missing, f'Missing runtime files: {missing}'

          hacs = json.loads(Path('hacs.json').read_text(encoding='utf-8'))
          assert hacs.get('name')
          assert not hacs.get('content_in_root')
          assert not hacs.get('zip_release')

          print('Verified HACS beta: 2026.10.0b3')
          PY

      - name: Publish tagged GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=2026.10.0b3
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the immutable prerelease untouched."
            gh release view "$TAG" --json tagName,isPrerelease,url,targetCommitish
            exit 0
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --prerelease \
            --title 'MotoGP Sensor 2026.10.0b3 — weekend beta' \
            --notes-file docs/hacs-beta-release-notes.md
          gh release view "$TAG" --json tagName,isPrerelease,url,targetCommitish
