# Development test. Replace the TWO old vertical-stack cards in your test view;
# do not stack this on top of the old schedule/timing cards.
# Install frontend/ha-motogp-card.js as a Lovelace JavaScript module first.
type: custom:ha-motogp-card
mode: both
visibility:
  - condition: state
    entity: binary_sensor.motogp_weekend_view
    state: 'on'
grid_options:
  columns: 24
  rows: auto

